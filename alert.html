<meta charset="utf-8">
<title>Hit Alert · Overlay</title>
<style>
  html, body { background: transparent; margin: 0; height: 100%; overflow: hidden; }

  #alert {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; opacity: 0; pointer-events: none;
  }
  #alert.show { animation: alert-in .45s cubic-bezier(.2,1.4,.4,1) forwards; }
  #alert.hide { animation: alert-out .4s ease forwards; }
  @keyframes alert-in  { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes alert-out { from { opacity: 1; } to { opacity: 0; transform: scale(.85); } }

  #banner {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 64px; font-weight: 900; letter-spacing: .08em;
    color: #ffd23f;
    text-shadow: 0 0 18px rgba(255,210,63,.9), 0 4px 14px rgba(0,0,0,.7);
    animation: banner-pulse 1s ease-in-out infinite;
  }
  #alert.epic #banner { font-size: 84px; color: #ffde70; }
  @keyframes banner-pulse { 50% { transform: scale(1.08); } }

  #acard {
    width: 300px; border-radius: 14px;
    box-shadow: 0 0 30px 6px rgba(255,210,63,.75), 0 14px 40px rgba(0,0,0,.6);
    animation: card-glow 1.4s ease-in-out infinite;
  }
  #alert.epic #acard { width: 380px; }
  @keyframes card-glow {
    50% { box-shadow: 0 0 55px 14px rgba(255,210,63,.95), 0 14px 40px rgba(0,0,0,.6); }
  }

  #aname, #aprice {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.8);
  }
  #aname  { font-size: 34px; font-weight: 800; }
  #aprice { font-size: 46px; font-weight: 900; color: #ffd23f; margin-top: -8px;
            text-shadow: 0 0 14px rgba(255,210,63,.8), 0 2px 10px rgba(0,0,0,.8); }

  .confetto {
    position: fixed; top: -20px; width: 12px; height: 18px;
    animation: fall linear forwards; pointer-events: none;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: .9; }
  }
  @media (prefers-reduced-motion: reduce) {
    #banner, #acard { animation: none; }
  }
</style>

<div id="alert">
  <div id="banner">HIT!</div>
  <img id="acard" src="" alt="">
  <div id="aname"></div>
  <div id="aprice"></div>
</div>

<script>
  /* Beobachtet die Tracker-Seite. Sobald oben im Karussell eine NEUE Karte
     auftaucht, wird sie hier gross eingeblendet (Glow, Sound, bei dicken
     Hits Konfetti). Als eigene OBS-Browserquelle in voller Canvas-Groesse
     ueber den Stream legen (Hintergrund ist transparent). */
  var lastKey = null;
  var showing = false;

  function tierOf(rarity, priceText) {
    var p = parseFloat((priceText || '').replace(',', '.').replace(/[^\d.]/g, '')) || 0;
    if (/special illustration|hyper/i.test(rarity) || p >= 50) return 'epic';
    return 'normal';
  }

  function chime(epic) {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var notes = epic ? [523, 659, 784, 1047, 1319] : [659, 880, 1109];
      notes.forEach(function (f, i) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.12);
        g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + i * 0.12 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.12 + 0.5);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime + i * 0.12);
        o.stop(ctx.currentTime + i * 0.12 + 0.55);
      });
    } catch (e) {}
  }

  function confetti() {
    var colors = ['#ffd23f', '#ff5964', '#7aa7ff', '#6ad3a2', '#c9adff', '#fff'];
    for (var i = 0; i < 60; i++) {
      var c = document.createElement('div');
      c.className = 'confetto';
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (2.2 + Math.random() * 2) + 's';
      c.style.animationDelay = (Math.random() * 0.8) + 's';
      c.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
      document.body.appendChild(c);
      setTimeout(function (el) { el.remove(); }.bind(null, c), 5500);
    }
  }

  function showAlert(info) {
    if (showing) return;
    showing = true;
    var alertEl = document.getElementById('alert');
    var epic = tierOf(info.rarity, info.price) === 'epic';
    document.getElementById('acard').src = info.img;
    document.getElementById('aname').textContent = info.name;
    document.getElementById('aprice').textContent = info.price;
    alertEl.classList.toggle('epic', epic);
    alertEl.classList.remove('hide');
    alertEl.classList.add('show');
    chime(epic);
    if (epic) confetti();
    var holdMs = epic ? 6000 : 3500;
    setTimeout(function () {
      alertEl.classList.remove('show');
      alertEl.classList.add('hide');
      setTimeout(function () { showing = false; }, 450);
    }, holdMs);
  }

  function check() {
    fetch('/booster-tracker.html', { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var doc = new DOMParser().parseFromString(t, 'text/html');
        var card = doc.querySelector('#carousel .card');
        var key = 'EMPTY';
        if (card) {
          var setEl = card.querySelector('.set');
          key = setEl ? setEl.textContent : 'EMPTY';
        }
        if (lastKey === null) {
          lastKey = key;  // Baseline: beim Start nicht feuern
        } else if (key !== lastKey && key !== 'EMPTY') {
          lastKey = key;
          var img = card.querySelector('img.thumb');
          showAlert({
            name: (card.querySelector('.name') || {}).textContent || '',
            price: (card.querySelector('.price') || {}).textContent || '',
            rarity: (card.querySelector('.chip') || {}).textContent || '',
            img: img ? img.getAttribute('src') : ''
          });
        } else {
          lastKey = key;
        }
        setTimeout(check, 1000);
      })
      .catch(function () { setTimeout(check, 2000); });
  }
  check();
</script>
