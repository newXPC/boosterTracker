name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app.html'
      - 'app_data.json'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Web-Dateien in App-Assets kopieren
        run: |
          mkdir -p android/app/src/main/assets/sv10_cards_images
          cp app.html opencv.js app_data.json android/app/src/main/assets/
          cp sv10_cards_images/*.png android/app/src/main/assets/sv10_cards_images/

      - name: Gradle-Wrapper erzeugen (pinnt Gradle-Version)
        working-directory: android
        run: gradle wrapper --gradle-version 8.7

      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KartenScanner.apk

      - name: Als Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Karten-Scanner APK
          body: |
            Android-App zum direkten Installieren (Sideload).
            Download: KartenScanner.apk → auf dem Handy öffnen →
            "Unbekannte Quellen" einmalig erlauben → installieren.
          files: KartenScanner.apk
