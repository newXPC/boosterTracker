<meta charset="utf-8">
<title>Stream Frame · Overlay</title>
<style>
  /* Dezenter Leuchtrahmen. Als OBS-Browserquelle exakt ueber das
     Kamerabild legen — die Mitte ist transparent. */
  html, body { background: transparent; margin: 0; height: 100%; overflow: hidden; }

  #frame {
    position: fixed; inset: 4px;
    border-radius: 14px;
    border: 2px solid rgba(255, 210, 63, .55);
    box-shadow:
      0 0 12px rgba(255, 210, 63, .35),
      inset 0 0 12px rgba(255, 210, 63, .2);
    animation: breathe 4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes breathe {
    50% {
      border-color: rgba(255, 210, 63, .85);
      box-shadow:
        0 0 20px rgba(255, 210, 63, .55),
        inset 0 0 16px rgba(255, 210, 63, .3);
    }
  }
  @media (prefers-reduced-motion: reduce) { #frame { animation: none; } }
</style>

<div id="frame"></div>
