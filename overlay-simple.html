<meta charset="utf-8">
<title>Booster-Tracker · Live</title>
<style>
  :root {
    --bg: #101418; --panel: #1a2129; --panel-edge: #26303b;
    --text: #e8edf2; --muted: #8b98a5; --price: #ffd23f; --live: #ff5964;
  }
  html { background: var(--bg); }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 10px; max-width: 560px; margin-inline: auto;
  }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  header h1 { font-size: .8rem; margin: 0; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .live-dot { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); }
  .live-dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  #search {
    width: 100%; padding: 8px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--panel-edge);
    color: var(--text); font-size: .9rem; margin-bottom: 6px; outline: none;
  }
  #search:focus { border-color: var(--price); }
  #search-results { margin-bottom: 8px; }
  #search-results .sr {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 6px 10px; font-size: .85rem;
    background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 8px; margin-bottom: 3px;
  }
  #search-results .sr .p { color: var(--price); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #search-results .sr .m { color: var(--muted); font-size: .75rem; }

  .card {
    background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 8px; padding: 8px 10px; margin-bottom: 6px;
    display: flex; align-items: center; gap: 10px;
  }
  .card.latest { border-color: var(--price); }
  .card img.thumb { width: 46px; border-radius: 3px; flex-shrink: 0; display: block; }
  .card.latest img.thumb { width: 64px; }
  .card .info { flex: 1; min-width: 0; }
  .card .name { font-size: .95rem; font-weight: 700; margin: 0; }
  .card.latest .name { font-size: 1.15rem; }
  .card .set { color: var(--muted); font-size: .7rem; margin: 0 0 4px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .price { font-size: 1rem; font-weight: 700; color: var(--price); font-variant-numeric: tabular-nums; }
  .card.latest .price { font-size: 1.35rem; }
  .chip {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    font-size: .65rem; font-weight: 600;
    border: 1px solid var(--panel-edge); color: var(--text); background: #222b35;
  }
  .empty { text-align: center; color: var(--muted); padding: 24px 16px; }
  .stream-total { text-align: right; font-size: .72rem; color: var(--muted); margin: -2px 0 8px; }
  .stream-total b { color: var(--price); font-variant-numeric: tabular-nums; }
  .display-label {
    display: flex; align-items: center; gap: 8px;
    font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 4px 0 10px;
  }
  .display-label::after { content: ""; flex: 1; height: 1px; background: var(--panel-edge); }
  details.display-old {
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 10px;
    margin-bottom: 12px; padding: 0 16px;
  }
  details.display-old summary { cursor: pointer; list-style: none; padding: 14px 0;
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  details.display-old summary::-webkit-details-marker { display: none; }
  details.display-old summary .d-name { font-weight: 700; font-size: 1rem; }
  details.display-old summary .d-stats { color: var(--muted); font-size: .8rem; }
  details.display-old .card { border: none; border-top: 1px solid var(--panel-edge); border-radius: 0; margin: 0; padding: 12px 0; }
  footer { text-align: center; color: var(--muted); font-size: .75rem; margin-top: 20px; }
</style>

<header>
  <h1>Booster-Tracker</h1>
  <span class="live-dot">LIVE</span>
</header>

<input id="search" type="text" placeholder="Karte suchen (Name oder Nummer)..." autocomplete="off">
<div id="search-results"></div>

<p class="stream-total">Heute gezogen: <b>0,00 &euro;</b></p>

<p class="display-label">Display 1 &middot; aktuell</p>

<p class="empty">Noch keine Karten erkannt</p>

<footer>Live-Update jede Sekunde · Preise: Cardmarket</footer>

<script>
  /* Soft-Update + Kartensuche. Suchfeld/-ergebnisse ueberleben das Update. */
  var lastHtml = null;
  var priceDb = null;

  function euro(v) {
    return (typeof v === 'number') ? ('~' + v.toFixed(2).replace('.', ',') + ' €') : '?';
  }

  function loadDb() {
    if (priceDb) return Promise.resolve(priceDb);
    return fetch('sv10-preise.json', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) { priceDb = d; return d; });
  }

  function renderSearch(q) {
    var box = document.getElementById('search-results');
    if (!q || q.length < 2) { box.innerHTML = ''; return; }
    loadDb().then(function (db) {
      var needle = q.toLowerCase();
      var hits = [];
      for (var i = 0; i < db.length && hits.length < 8; i++) {
        var c = db[i];
        var name = (c.name_de || c.name || '').toLowerCase();
        if (name.indexOf(needle) !== -1 || String(c.number) === needle.replace(/\D/g, '')) {
          hits.push(c);
        }
      }
      box.innerHTML = hits.map(function (c) {
        return '<div class="sr"><span>' + (c.name_de || c.name) +
          ' <span class="m">' + c.number + '/182 · ' + (c.rarity || '') + '</span></span>' +
          '<span class="p">' + euro(c.avg7) + '</span></div>';
      }).join('') || '<div class="sr"><span class="m">Nichts gefunden</span></div>';
    });
  }

  function wireSearch() {
    var inp = document.getElementById('search');
    if (inp) inp.addEventListener('input', function () { renderSearch(inp.value); });
  }

  function tick() {
    fetch(location.href, { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        if (lastHtml === null) { lastHtml = t; }
        else if (t !== lastHtml) {
          lastHtml = t;
          // Suchzustand retten
          var q = '', focused = false;
          var inp = document.getElementById('search');
          if (inp) { q = inp.value; focused = (document.activeElement === inp); }
          var doc = new DOMParser().parseFromString(t, 'text/html');
          if (doc && doc.body) {
            document.body.innerHTML = doc.body.innerHTML;
            wireSearch();
            var inp2 = document.getElementById('search');
            if (inp2) {
              inp2.value = q;
              if (focused) inp2.focus();
              renderSearch(q);
            }
          }
        }
        setTimeout(tick, 1000);
      })
      .catch(function () { setTimeout(tick, 2000); });
  }

  wireSearch();
  tick();
</script>
