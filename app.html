<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#101418">
<title>Karten-Scanner</title>
<style>
  :root {
    --bg: #101418; --panel: #1a2129; --panel-edge: #26303b;
    --text: #e8edf2; --muted: #8b98a5; --price: #ffd23f; --ok: #6ad3a2;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; }
  header h1 { font-size: .85rem; margin: 0; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); }
  #status { font-size: .75rem; color: var(--muted); }
  #status.ready { color: var(--ok); }

  #search {
    display: block; width: calc(100% - 20px); margin: 0 10px 8px;
    padding: 9px 14px; border-radius: 999px; font-size: .9rem;
    background: var(--panel); border: 1px solid var(--panel-edge);
    color: var(--text); outline: none;
  }
  #search:focus { border-color: var(--price); }
  #search-results { margin: 0 10px 8px; }
  #search-results .sr {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 7px 10px; font-size: .85rem; margin-bottom: 3px;
    background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 8px;
  }
  #search-results .sr .p { color: var(--price); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #search-results .sr .m { color: var(--muted); font-size: .75rem; }

  #setpicker { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 10px 10px; }
  .setchip { padding: 6px 12px; border-radius: 999px; font-size: .8rem;
    background: var(--panel); border: 1px solid var(--panel-edge);
    color: var(--muted); }
  .setchip.active { border-color: var(--price); color: var(--price);
    font-weight: 700; }

  #camwrap { position: relative; margin: 0 10px; border-radius: 12px;
    overflow: hidden; border: 1px solid var(--panel-edge); }
  video { width: 100%; display: block; }
  #scanline { position: absolute; left: 8%; right: 8%; height: 2px;
    background: rgba(255, 210, 63, .8); top: 10%;
    animation: sweep 2.4s ease-in-out infinite alternate; }
  @keyframes sweep { to { top: 88%; } }
  #camwrap.found #scanline { background: var(--ok); animation: none; top: 50%; }

  #result { margin: 10px; background: var(--panel);
    border: 1px solid var(--panel-edge); border-radius: 12px; padding: 14px;
    min-height: 84px; }
  #result .name { font-size: 1.2rem; font-weight: 800; }
  #result .meta { font-size: .78rem; color: var(--muted); margin-top: 2px; }
  #result .price { font-size: 1.6rem; font-weight: 800; color: var(--price);
    margin-top: 4px; font-variant-numeric: tabular-nums; }
  #result.idle { color: var(--muted); font-size: .85rem; }

  #stats { display: flex; gap: 8px; margin: 0 10px 10px; }
  .stat { flex: 1; background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 10px; text-align: center; padding: 8px 4px; }
  .stat .num { font-size: 1.2rem; font-weight: 800; color: var(--price);
    font-variant-numeric: tabular-nums; }
  .stat .lbl { font-size: .6rem; text-transform: uppercase; color: var(--muted);
    letter-spacing: .05em; }

  #list { margin: 0 10px 20px; }
  #list .row { display: flex; justify-content: space-between; gap: 8px;
    padding: 7px 4px; border-bottom: 1px solid var(--panel-edge);
    font-size: .85rem; }
  #list .row .p { color: var(--price); font-variant-numeric: tabular-nums;
    white-space: nowrap; }
  #list .row .r { color: var(--muted); font-size: .75rem; }

  #startbtn { display: block; margin: 14px auto; padding: 14px 40px;
    font-size: 1.05rem; font-weight: 700; color: #101418;
    background: var(--price); border: none; border-radius: 999px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>Karten-Scanner</h1>
  <span id="status">lade...</span>
</header>

<div id="setpicker"></div>

<input id="search" type="text" placeholder="Karte suchen (Name oder Nummer)..." autocomplete="off">
<div id="search-results"></div>

<button id="startbtn" class="hidden">Kamera starten</button>

<div id="camwrap" class="hidden">
  <video id="video" autoplay playsinline muted></video>
  <div id="scanline"></div>
</div>

<div id="result" class="idle">Karte flach und gut beleuchtet vor die Kamera halten</div>

<div id="stats">
  <div class="stat"><div class="num" id="scount">0</div><div class="lbl">Karten</div></div>
  <div class="stat"><div class="num" id="stotal">0,00 €</div><div class="lbl">Gesamtwert</div></div>
</div>

<div id="list"></div>

<script>
/* Handy-Karten-Scanner (ORB + RANSAC via OpenCV.js).
   Daten kommen LIVE von GitHub (immer aktuelle Preise + neue Sets);
   ohne Internet greift das in der APK mitgelieferte Paket. */
var REMOTE = 'https://raw.githubusercontent.com/newXPC/boosterTracker/master/';

var SETS = [];          // sets.json
var currentSet = null;  // {id, name, total}
var DB = null;
var refKps = {};
var bigDesc = null;     // eine grosse Deskriptor-Matrix
var owner = [];
var rowOffset = {};
var cvReady = false, camReady = false, running = false, indexReady = false;

var MIN_VOTES = 6, MIN_INLIERS = 8, GATE_EMPTY_SCANS = 2;
var scanned = [], total = 0, lastNum = null, emptyStreak = 99;

window.onerror = function (msg) {
  var el = document.getElementById('status');
  if (el) { el.textContent = 'Fehler: ' + msg; el.className = ''; }
};

function setStatus(t, ready) {
  var el = document.getElementById('status');
  el.textContent = t;
  el.className = ready ? 'ready' : '';
}

function fetchJson(url, timeoutMs) {
  return new Promise(function (resolve, reject) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, timeoutMs);
    fetch(url, { cache: 'no-store', signal: ctrl.signal })
      .then(function (r) {
        clearTimeout(timer);
        if (!r.ok) return reject(new Error('HTTP ' + r.status));
        resolve(r.json());
      })
      .catch(function (e) { clearTimeout(timer); reject(e); });
  });
}

function loadJsonRemoteFirst(path, timeoutMs) {
  // Online-Version bevorzugen (aktuelle Preise), lokales Asset als Fallback
  return fetchJson(REMOTE + path, timeoutMs).catch(function () {
    return fetchJson(path, 5000);
  });
}

function b64ToBytes(b64) {
  var bin = atob(b64), out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function freeIndex() {
  if (bigDesc) { bigDesc.delete(); bigDesc = null; }
  refKps = {}; owner = []; rowOffset = {};
}

function buildIndex() {
  freeIndex();
  var rows = 0;
  for (var num in DB) rows += DB[num].n;
  bigDesc = new cv.Mat(rows, 32, cv.CV_8U);
  var off = 0;
  for (var num in DB) {
    bigDesc.data.set(b64ToBytes(DB[num].des), off * 32);
    refKps[num] = new Float32Array(DB[num].kps);
    rowOffset[num] = off;
    for (var i = 0; i < DB[num].n; i++) owner.push(num);
    off += DB[num].n;
  }
  indexReady = true;
}

function renderPicker() {
  var el = document.getElementById('setpicker');
  el.innerHTML = '';
  SETS.forEach(function (s) {
    var b = document.createElement('button');
    b.className = 'setchip' + (currentSet && s.id === currentSet.id ? ' active' : '');
    b.textContent = s.name;
    b.onclick = function () { selectSet(s); };
    el.appendChild(b);
  });
}

function selectSet(s) {
  currentSet = s;
  indexReady = false;
  try { localStorage.setItem('set', s.id); } catch (e) {}
  renderPicker();
  setStatus('lade ' + s.name + '...');
  loadJsonRemoteFirst('sets/' + s.id + '/app_data.json', 12000)
    .then(function (d) {
      DB = d;
      if (cvReady) { buildIndex(); onReady(); }
      else { var t = setInterval(function () {
        if (cvReady) { clearInterval(t); buildIndex(); onReady(); } }, 200); }
    })
    .catch(function (e) { setStatus('Set nicht ladbar: ' + e.message); });
}

function onReady() {
  setStatus(currentSet.name + ' · ' + Object.keys(DB).length + ' Karten', true);
  if (!camReady) document.getElementById('startbtn').classList.remove('hidden');
}

// Sets laden (online zuerst -> neue Sets erscheinen automatisch)
loadJsonRemoteFirst('sets.json', 8000).then(function (s) {
  SETS = s;
  var wanted = null;
  try { wanted = localStorage.getItem('set'); } catch (e) {}
  var initial = SETS[0];
  for (var i = 0; i < SETS.length; i++) if (SETS[i].id === wanted) initial = SETS[i];
  selectSet(initial);
}).catch(function (e) { setStatus('Keine Daten: ' + e.message); });

// OpenCV.js laden (lokal aus der APK / dem Repo)
var cvScript = document.createElement('script');
cvScript.src = 'opencv.js';
cvScript.onload = function () {
  if (cv.getBuildInformation) { cvReady = true; }
  else cv.onRuntimeInitialized = function () { cvReady = true; };
};
document.head.appendChild(cvScript);

// Kartensuche im aktuell geladenen Set
document.getElementById('search').addEventListener('input', function () {
  var q = this.value.trim().toLowerCase();
  var box = document.getElementById('search-results');
  if (!DB || q.length < 2) { box.innerHTML = ''; return; }
  var digits = q.replace(/\D/g, '');
  var html = '', count = 0;
  for (var num in DB) {
    if (count >= 8) break;
    var c = DB[num];
    var name = (c.name || '').toLowerCase();
    if (name.indexOf(q) !== -1 || (digits && num === String(parseInt(digits, 10)))) {
      var tot = currentSet && currentSet.total ? '/' + currentSet.total : '';
      html += '<div class="sr"><span>' + c.name +
        ' <span class="m">' + num + tot + ' · ' + (c.rarity || '') + '</span></span>' +
        '<span class="p">~' + euro(c.avg7) + '</span></div>';
      count++;
    }
  }
  box.innerHTML = html || '<div class="sr"><span class="m">Nichts gefunden</span></div>';
});

document.getElementById('startbtn').addEventListener('click', function () {
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false
  }).then(function (stream) {
    var v = document.getElementById('video');
    v.srcObject = stream;
    camReady = true; running = true;
    document.getElementById('startbtn').classList.add('hidden');
    document.getElementById('camwrap').classList.remove('hidden');
    setTimeout(scanLoop, 800);
  }).catch(function (e) { setStatus('Kamera verweigert: ' + e.name); });
});

function euro(v) {
  return (typeof v === 'number')
    ? v.toFixed(2).replace('.', ',') + ' €' : '?';
}

function showResult(num) {
  var c = DB[num];
  var total_txt = currentSet && currentSet.total ? '/' + currentSet.total : '';
  document.getElementById('result').className = '';
  document.getElementById('result').innerHTML =
    '<div class="name">' + c.name + '</div>' +
    '<div class="meta">' + num + total_txt + ' · ' + c.rarity + '</div>' +
    '<div class="price">~' + euro(c.avg7) + '</div>';

  scanned.unshift(num);
  if (typeof c.avg7 === 'number') total += c.avg7;
  document.getElementById('scount').textContent = scanned.length;
  document.getElementById('stotal').textContent = euro(total);
  var row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = '<span>' + c.name + ' <span class="r">' + c.rarity +
    '</span></span><span class="p">' + euro(c.avg7) + '</span>';
  document.getElementById('list').prepend(row);
  if (navigator.vibrate) navigator.vibrate(80);
}

function scanFrame() {
  var v = document.getElementById('video');
  if (!v.videoWidth || !indexReady) return null;
  var W = 480, H = Math.round(v.videoHeight * (W / v.videoWidth));
  var cnv = document.createElement('canvas');
  cnv.width = W; cnv.height = H;
  cnv.getContext('2d').drawImage(v, 0, 0, W, H);
  var src = cv.imread(cnv), gray = new cv.Mat();
  cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
  src.delete();

  var orb = new cv.ORB(800);
  var kp = new cv.KeyPointVector(), des = new cv.Mat();
  orb.detectAndCompute(gray, new cv.Mat(), kp, des);
  gray.delete(); orb.delete();
  if (des.rows < 40) { kp.delete(); des.delete(); return null; }

  var bf = new cv.BFMatcher(cv.NORM_HAMMING, false);
  var knn = new cv.DMatchVectorVector();
  bf.knnMatch(des, bigDesc, knn, 2);
  var votes = {}, corr = {};
  for (var i = 0; i < knn.size(); i++) {
    var pair = knn.get(i);
    if (pair.size() < 2) continue;
    var m = pair.get(0), n2 = pair.get(1);
    if (m.distance < 0.75 * n2.distance) {
      var num = owner[m.trainIdx];
      votes[num] = (votes[num] || 0) + 1;
      if (!corr[num]) corr[num] = [];
      corr[num].push([m.queryIdx, m.trainIdx - rowOffset[num]]);
    }
  }
  knn.delete(); bf.delete();

  var best = null, bestVotes = 0;
  for (var num in votes) if (votes[num] > bestVotes) { best = num; bestVotes = votes[num]; }
  var out = null;
  if (best && bestVotes >= MIN_VOTES) {
    try {
      var pairs = corr[best], srcPts = [], dstPts = [];
      for (var j = 0; j < pairs.length; j++) {
        var q = kp.get(pairs[j][0]).pt;
        srcPts.push(q.x, q.y);
        dstPts.push(refKps[best][pairs[j][1] * 2], refKps[best][pairs[j][1] * 2 + 1]);
      }
      var sm = cv.matFromArray(pairs.length, 1, cv.CV_32FC2, srcPts);
      var dm = cv.matFromArray(pairs.length, 1, cv.CV_32FC2, dstPts);
      var mask = new cv.Mat();
      var Hm = cv.findHomography(sm, dm, cv.RANSAC, 5.0, mask);
      var inliers = 0;
      for (var j = 0; j < mask.rows; j++) if (mask.data[j]) inliers++;
      sm.delete(); dm.delete(); mask.delete(); Hm.delete();
      if (inliers >= MIN_INLIERS) out = best;
    } catch (e) {
      if (bestVotes >= MIN_VOTES * 2) out = best;
    }
  }
  kp.delete(); des.delete();
  return out;
}

function scanLoop() {
  if (!running) return;
  var num = null;
  try { num = scanFrame(); } catch (e) {}
  var wrap = document.getElementById('camwrap');
  if (num === null) {
    emptyStreak++;
    wrap.classList.remove('found');
  } else {
    wrap.classList.add('found');
    if (num !== lastNum || emptyStreak >= GATE_EMPTY_SCANS) {
      lastNum = num;
      showResult(num);
    }
    emptyStreak = 0;
  }
  setTimeout(scanLoop, 350);
}
</script>
</body>
</html>
